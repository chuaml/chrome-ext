<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Settings - CSS Injector</title>
    <style>
        :root {
            --primary-color: #4285f4;
            --primary-hover: #357abd;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --danger-color: #d93025;
            --success-color: #1e8e3e;
            --input-bg: #ffffff;
            --table-header: #f1f3f4;
            --shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
            --transition: all 0.2s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #8ab4f8;
                --primary-hover: #aecbfa;
                --bg-color: #202124;
                --card-bg: #292a2d;
                --text-color: #e8eaed;
                --text-secondary: #9aa0a6;
                --border-color: #3c4043;
                --danger-color: #f28b82;
                --success-color: #81c995;
                --input-bg: #303134;
                --table-header: #3c4043;
                --shadow: 0 1px 3px 0 rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15);
            }
        }

        body[data-theme="light"] {
            --primary-color: #4285f4;
            --primary-hover: #357abd;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --danger-color: #d93025;
            --success-color: #1e8e3e;
            --input-bg: #ffffff;
            --table-header: #f1f3f4;
            --shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
        }

        body[data-theme="dark"] {
            --primary-color: #8ab4f8;
            --primary-hover: #aecbfa;
            --bg-color: #202124;
            --card-bg: #292a2d;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --border-color: #3c4043;
            --danger-color: #f28b82;
            --success-color: #81c995;
            --input-bg: #303134;
            --table-header: #3c4043;
            --shadow: 0 1px 3px 0 rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            line-height: 1.5;
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { 
            margin: 0; 
            font-size: 1.75rem;
            font-weight: 500;
            color: var(--primary-color); 
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 14px;
            background: var(--table-header);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(0,0,0,0.02); }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
        }

        button:hover { 
            background: var(--bg-color);
            border-color: var(--text-secondary);
        }

        button.primary {
            background: var(--primary-color);
            color: var(--bg-color);
            border-color: var(--primary-color);
        }

        button.primary:hover { 
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        button.danger {
            color: var(--danger-color);
        }

        button.danger:hover { 
            background: rgba(217, 48, 37, 0.1);
            border-color: var(--danger-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .close-modal {
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .close-modal:hover { color: var(--text-color); }

        textarea {
            width: 100%;
            height: 400px;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            padding: 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.2);
        }

        .search-box {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 300px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            background: var(--badge-bg);
            color: var(--primary-color);
            text-transform: uppercase;
        }

        pre {
            margin: 0;
            font-size: 0.8rem;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-secondary);
            font-family: monospace;
        }

        #global-state-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .state-item {
            padding: 16px;
            background: var(--bg-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .state-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .state-value {
            font-weight: 500;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Advanced Settings</h1>
            <div class="actions-cell">
                <button id="btn-export">Export Config</button>
                <button id="btn-import">Import Config</button>
                <button id="btn-reset" class="danger">Reset All</button>
            </div>
        </header>

        <div class="toolbar">
            <input type="text" id="search-input" class="search-box" placeholder="Search domains or keys...">
            <select id="theme-select" class="search-box" style="width: auto;">
                <option value="system">System Theme</option>
                <option value="light">Light Mode</option>
                <option value="dark">Dark Mode</option>
            </select>
            <button id="btn-refresh">Refresh</button>
        </div>

        <div class="card" id="global-sessions-card">
            <div class="section-title">Global State</div>
            <div id="global-state-content">
                <!-- UI Session and other global flags -->
            </div>
        </div>

        <div class="card">
            <div class="section-title">Saved Configurations</div>
            <table id="settings-table">
                <thead>
                    <tr>
                        <th>Domain / Key</th>
                        <th>Type</th>
                        <th>Preview</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="settings-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Edit Setting</h2>
                <span class="close-modal" id="close-modal">&times;</span>
            </div>
            <div id="edit-container">
                <textarea id="edit-area" spellcheck="false"></textarea>
                <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                    <button id="btn-cancel-edit">Cancel</button>
                    <button id="btn-save-edit" class="primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="import-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Import Configuration</h2>
                <span class="close-modal" id="close-import">&times;</span>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Paste JSON configuration below. <strong style="color: var(--danger-color);">This will overwrite all current settings!</strong></p>
            <textarea id="import-area" placeholder='{ "css_google.com": "...", ... }' spellcheck="false"></textarea>
            <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
                <button id="btn-cancel-import">Cancel</button>
                <button id="btn-confirm-import" class="primary">Confirm Import</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/options.js"></script>
</body>
</html>
