<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Injector</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            resize: vertical;
        }
        button {
            padding: 8px;
            cursor: pointer;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #357abd;
        }
        .status {
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <h3 style="margin: 0;">CSS Injector</h3>
        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: bold;">
            <input type="checkbox" id="master-toggle" checked> Enabled
        </label>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <label style="font-size: 0.9em; cursor: pointer;">
            <input type="radio" name="scope" value="domain" checked id="scope-domain"> Domain
        </label>
        <label style="font-size: 0.9em; cursor: pointer;">
            <input type="radio" name="scope" value="global" id="scope-global"> Global
        </label>
    </div>
    <div id="domain-display" style="font-size: 0.9em; margin-bottom: 5px; color: #444; font-weight: bold;"></div>
    <textarea id="css-input" placeholder="/* Enter CSS here */
body { background: red !important; }"></textarea>
    <button id="inject-btn">Inject CSS</button>
    <div id="status" class="status"></div>

    <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">
        <h4 style="margin: 0 0 10px 0;">Privacy Settings</h4>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9em; cursor: pointer;">
                <input type="checkbox" id="toggle-gtag" checked> Block GTag Tracking
            </label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9em; cursor: pointer;">
                <input type="checkbox" id="toggle-referrer" checked> Stealth Referrer Policy
            </label>
        </div>
    </div>

    <script type="module" src="/src/sidepanel.js"></script>
</body>
</html>
