<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Extension</title>
    <style>
        :root {
            background-color: #333;
            color: #eee;
        }

        body {
            background-color: #222;
            color: #eee;
            padding: 1rem;
            min-width: 10rem;
            min-height: 10rem;
        }

        @media (prefers-color-scheme: light) {
            :root {
                background-color: unset;
                color: unset;
            }

            body {
                background-color: unset;
                color: unset;
            }
        }

        label:has(>input[type=checkbox]:not(:disabled)) {
            cursor: pointer;
            &> input {
                cursor: pointer;
                vertical-align: text-bottom;
                margin: 0;
            }
            &:active,&>input:active {
                cursor: default;
            }
            &:focus-within:hover {
                outline: 1px solid #aaa;
            }
        }
        #txtCssCode{
            min-height: 20rem;
            cursor: text;
            border: 1px solid #eee;
            padding: .5rem;
            /* font-family: 'Courier New', Courier, monospace; */
            font-size: .7rem;
        }
    </style>
</head>

<body>
    <div>
        <div>
            <label>
                <input type="checkbox" id="chkDarkMode">
                <span>Dark Mode:</span>
            </label>

            <div id="txtCssCode" contenteditable="plaintext-only" spellcheck="false"></div>
        </div>
    </div>
    <textarea readonly>
html,
body {
    background-color: #222;
}

@media (prefers-color-scheme: dark) {

    body {
        background-color: unset;
    }

    html {
        filter: invert(.9) hue-rotate(180deg) brightness(1.1) saturate(1);
        background-color: #eee;
    }

    img,
    iframe {
        filter: invert(1) hue-rotate(180deg) brightness(1) saturate(1);
    }
}
    </textarea>
    <script src="popup.menu.js"></script>
</body>

</html>
